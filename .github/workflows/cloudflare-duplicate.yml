name: Verify and deploy Cloudflare duplicate
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'netlify/**'
      - 'cloudflare/**'
      - 'containers/**'
      - 'tests/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite*.ts'
      - '.github/workflows/cloudflare-duplicate.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'netlify/**'
      - 'cloudflare/**'
      - 'containers/**'
      - 'tests/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite*.ts'
      - '.github/workflows/cloudflare-duplicate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-duplicate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Enable disposable PostgreSQL 17 checks
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/recap-pgdg.list
            sudo apt-get update
            sudo apt-get install --yes postgresql-17
          fi
          for binary in initdb pg_ctl psql; do
            test -x "/usr/lib/postgresql/17/bin/$binary"
          done
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/initdb --version
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm run check:cloudflare
      - name: Deploy the checked duplicate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HOSTING_TARGET != 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cloudflare
